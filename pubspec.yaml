name: turbo_traffic_rush
description: "Turbo Traffic Rush - pseudo-3D arcade traffic racer built with Flutter and Flame."

publish_to: 'none'

version: 2.0.2+11

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.5
  sensors_plus: ^7.1.0
  purchases_flutter: ^10.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
